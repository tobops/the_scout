<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>The Scout – Thinking</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6B3A}a:hover{color:#08512C}
</style>
</head>
<body>
<div style="width: 1440px; min-height: 1024px; box-sizing: border-box; background: #F3F6F1; color: #0A1F14; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 72px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #DCE5DC">
    <a href="the-scout-home.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0A1F14">
      <span style="width: 40px; height: 40px; border-radius: 8px; background: #0B6B3A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>
      <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 32px; letter-spacing: 1px; line-height: 1">The Scout</span>
    </a>
    <nav aria-label="Main"><a href="the-scout-game.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 24px; border-radius: 8px; background: #0B6B3A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Play</a></nav>
  </header>

  <main style="flex: 1; padding: 48px; display: flex; gap: 32px; align-items: flex-start">
    <section style="flex: 1; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 32px; letter-spacing: 1px">Question 4 of 20</span>
          <span style="font-size: 14px; color: #4A5E52">16 left</span>
        </div>
        <div role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="4" aria-label="Question progress" style="height: 12px; border-radius: 8px; background: #DCE5DC; overflow: hidden"><div style="width: 20%; height: 12px; border-radius: 8px; background: #0B6B3A"></div></div>
      </div>

      <div role="status" style="background: #0B6B3A; color: #FFFFFF; border-radius: 24px; padding: 64px; min-height: 360px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; text-align: center">
        <div aria-hidden="true" style="display: flex; gap: 16px">
          <span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF"></span>
          <span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; opacity: 0.6"></span>
          <span style="width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; opacity: 0.3"></span>
        </div>
        <h1 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: 80px; line-height: 1; letter-spacing: 1px">The Scout is thinking…</h1>
        <p style="margin: 0; font-size: 18px; color: #E6F4EB">Narrowing down the shortlist</p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px">
        <button type="button" disabled style="height: 88px; border-radius: 16px; border: 2px solid #DCE5DC; background: #E9EEE7; color: #6B7C71; font: 600 18px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: not-allowed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Yes</button>
        <button type="button" disabled style="height: 88px; border-radius: 16px; border: 2px solid #DCE5DC; background: #E9EEE7; color: #6B7C71; font: 600 18px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: not-allowed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>No</button>
        <button type="button" disabled style="height: 88px; border-radius: 16px; border: 2px solid #DCE5DC; background: #E9EEE7; color: #6B7C71; font: 600 18px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: not-allowed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"></path><path d="M12 17h.01"></path></svg>Don't know</button>
        <button type="button" disabled style="height: 88px; border-radius: 16px; border: 2px solid #DCE5DC; background: #E9EEE7; color: #6B7C71; font: 600 18px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: not-allowed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l6-6 4 4 6-6"></path><path d="M15 8h5v5"></path></svg>Probably</button>
        <button type="button" disabled style="height: 88px; border-radius: 16px; border: 2px solid #DCE5DC; background: #E9EEE7; color: #6B7C71; font: 600 18px Inter, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: not-allowed"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8l6 6 4-4 6 6"></path><path d="M15 16h5v-5"></path></svg>Probably not</button>
      </div>
    </section>

    <aside style="width: 400px; background: #FFFFFF; border: 1px solid #DCE5DC; border-radius: 24px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: 32px; letter-spacing: 1px">Previous questions</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
        <li style="display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 12px; background: #F3F6F1">
          <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 24px; color: #4A5E52; width: 24px">1</span>
          <span style="flex: 1; font-size: 15px; line-height: 1.4">Is your player still active?</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #0B6B3A; color: #FFFFFF; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Yes</span>
        </li>
        <li style="display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 12px; background: #F3F6F1">
          <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 24px; color: #4A5E52; width: 24px">2</span>
          <span style="flex: 1; font-size: 15px; line-height: 1.4">Is your player a forward?</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #0B6B3A; color: #FFFFFF; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Yes</span>
        </li>
        <li style="display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 12px; background: #F3F6F1">
          <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 24px; color: #4A5E52; width: 24px">3</span>
          <span style="flex: 1; font-size: 15px; line-height: 1.4">Is your player from South America?</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #0A1F14; color: #FFFFFF; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>No</span>
        </li>
        <li style="display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 12px; background: #E3F2E8; border: 2px solid #0B6B3A">
          <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 24px; color: #0B6B3A; width: 24px">4</span>
          <span style="flex: 1; font-size: 15px; line-height: 1.4">Does your player play in the Premier League?</span>
          <span style="display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: #0A1F14; color: #FFFFFF; font-size: 13px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>No</span>
        </li>
      </ol>
    </aside>
  </main>
</div>
</body>
</html>
