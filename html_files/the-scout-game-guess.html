<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>The Scout – Guess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B6B3A}a:hover{color:#08512C}
</style>
</head>
<body>
<div style="width: 1440px; min-height: 1024px; box-sizing: border-box; background: #F3F6F1; color: #0A1F14; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="height: 72px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-bottom: 1px solid #DCE5DC">
    <a href="the-scout-home.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0A1F14">
      <span style="width: 40px; height: 40px; border-radius: 8px; background: #0B6B3A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>
      <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 32px; letter-spacing: 1px; line-height: 1">The Scout</span>
    </a>
    <nav aria-label="Main"><a href="the-scout-game.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 24px; border-radius: 8px; background: #0B6B3A; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Play</a></nav>
  </header>

  <main style="flex: 1; padding: 48px 48px 96px; display: flex; flex-direction: column; align-items: center; gap: 48px">
    <div style="width: 960px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'Bebas Neue', Impact, sans-serif; font-size: 32px; letter-spacing: 1px">Guess after 12 questions</span>
        <span style="font-size: 14px; color: #4A5E52">8 left</span>
      </div>
      <div role="progressbar" aria-valuemin="0" aria-valuemax="20" aria-valuenow="12" aria-label="Question progress" style="height: 12px; border-radius: 8px; background: #DCE5DC; overflow: hidden"><div style="width: 60%; height: 12px; border-radius: 8px; background: #0B6B3A"></div></div>
    </div>

    <section style="width: 960px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DCE5DC; border-radius: 24px; padding: 80px 64px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
      <span style="width: 96px; height: 96px; border-radius: 24px; background: #0B6B3A; display: flex; align-items: center; justify-content: center"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path></svg></span>
      <p style="margin: 0; font-size: 22px; font-weight: 500; color: #4A5E52">I think your player is…</p>
      <h1 style="margin: 0; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: 128px; line-height: 0.9; letter-spacing: 2px; color: #0B6B3A">Kylian Mbappé</h1>
      <div style="display: flex; gap: 8px">
        <span style="padding: 6px 14px; border-radius: 999px; background: #F3F6F1; border: 1px solid #DCE5DC; font-size: 14px; font-weight: 600">Forward</span>
        <span style="padding: 6px 14px; border-radius: 999px; background: #F3F6F1; border: 1px solid #DCE5DC; font-size: 14px; font-weight: 600">France</span>
      </div>
      <div style="display: flex; gap: 16px; margin-top: 24px">
        <a href="the-scout-result-win.html" style="height: 64px; padding: 0 32px; border-radius: 16px; background: #0B6B3A; color: #FFFFFF; font: 700 18px Inter, sans-serif; display: inline-flex; align-items: center; gap: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Yes, that's my player</a>
        <a href="the-scout-game.html" style="height: 64px; padding: 0 32px; border-radius: 16px; background: #FFFFFF; border: 2px solid #0A1F14; box-sizing: border-box; color: #0A1F14; font: 700 18px Inter, sans-serif; display: inline-flex; align-items: center; gap: 10px; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>No, keep going</a>
      </div>
    </section>
  </main>
</div>
</body>
</html>
